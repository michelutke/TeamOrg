appId: ch.teamorg
---
# Cold start with wiped app data. The iOS keychain survives clearState, so it is cleared explicitly
# (needed when one flow signs in as several users).
- runFlow:
    when:
      platform: iOS
    commands:
      - clearKeychain
- launchApp:
    clearState: true
    stopApp: true
- runFlow: dismiss-alerts.yaml
