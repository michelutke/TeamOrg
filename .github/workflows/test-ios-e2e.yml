name: iOS E2E (Maestro)

permissions:
  contents: read

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'composeApp/**'
      - 'shared/**'
      - 'iosApp/**'
      - 'gradle/**'
      - 'e2e/**'
      - '.github/workflows/test-ios-e2e.yml'
  push:
    branches: [ main, 'release/**' ]

concurrency:
  group: ios-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-ios-e2e:
    name: iOS Simulator E2E
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v3

      # macOS runners cannot run service containers, so Postgres comes from Homebrew.
      - name: Start Postgres
        run: |
          brew install postgresql@16
          brew services start postgresql@16
          PG_BIN="$(brew --prefix postgresql@16)/bin"
          echo "$PG_BIN" >> "$GITHUB_PATH"
          for _ in $(seq 1 30); do
            "$PG_BIN/pg_isready" -h localhost && break
            sleep 2
          done
          "$PG_BIN/psql" -h localhost -d postgres -c "CREATE USER teamorg WITH PASSWORD 'teamorg' CREATEDB;"
          "$PG_BIN/psql" -h localhost -d postgres -c "CREATE DATABASE teamorg OWNER teamorg;"

      - name: Install Maestro and jq
        env:
          MAESTRO_VERSION: 2.0.10
        run: |
          brew install jq
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Build server
        run: ./gradlew :server:installDist

      - name: Start server
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/teamorg?user=teamorg&password=teamorg
          JWT_SECRET: ci-ios-e2e-tests-not-a-real-secret-0123456789
          SWISSVOLLEY_SYNC_ENABLED: 'false'
          STRIPE_SECRET_KEY: sk_test_ci_dummy
          E2E_SEED_ENABLED: 'true'
        run: |
          server/build/install/server/bin/server > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/health > /dev/null; then
              echo "server healthy after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "server never became healthy; last 100 log lines:"
          tail -100 server.log
          exit 1

      - name: Build iOS app for the simulator
        timeout-minutes: 30
        run: |
          APP_PATH="$(e2e/ios/build-sim.sh http://localhost:8080 | tail -1)"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Boot simulator and install app
        run: |
          DEVICE="$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')"
          echo "simulator $DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP_PATH"
          echo "E2E_IOS_DEVICE=$DEVICE" >> "$GITHUB_ENV"

      - name: Run Maestro E2E flows
        timeout-minutes: 30
        run: e2e/maestro/run.sh ios

      - name: Upload Maestro artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-artifacts-ios
          path: build/maestro-artifacts
          retention-days: 7

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e-server-log
          path: server.log
          retention-days: 7

      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" || true
