name: Deploy Android to Updraft

permissions:
  contents: read

on:
  push:
    branches:
      - main
    # A docs, server or web change cannot alter the APK, so it must not spend a build.
    # Use workflow_dispatch to force a build outside these paths.
    paths:
      - 'composeApp/**'
      - 'shared/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'fastlane/**'
      - 'Gemfile'
      - 'Gemfile.lock'
      - '.github/workflows/deploy-android.yml'
  workflow_dispatch:

# One Updraft build per branch. A newer commit makes the running build obsolete, so
# cancel it instead of letting two builds race to upload.
concurrency:
  group: deploy-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  updraft:
    name: fastlane android_updraft
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true

      - name: Create local.properties
        run: |
          echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" >> local.properties
          echo "onesignal.appId=${{ secrets.ONESIGNAL_APP_ID }}" >> local.properties

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > composeApp/google-services.json
          else
            echo "Error: GOOGLE_SERVICES_JSON_BASE64 secret is required."
            exit 1
          fi

      - name: Decode Keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > composeApp/release.jks

      - name: Build and upload
        run: bundle exec fastlane android_updraft
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
          UPDRAFT_APP_KEY: ${{ secrets.UPDRAFT_APP_KEY }}
          UPDRAFT_API_KEY: ${{ secrets.UPDRAFT_API_KEY }}
