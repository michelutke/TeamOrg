name: Android Instrumented Tests

permissions:
  contents: read

# Separate workflow rather than a job in test.yml: `on.paths` is workflow-scoped, so
# putting these filters in test.yml would silently path-filter the backend, shared, and
# unit-test jobs too. The emulator is the most expensive job in CI, so it only runs when
# Android-relevant code changed — matching the policy set in cbc785c.
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'composeApp/**'
      - 'shared/**'
      - 'gradle/**'
      - '.github/workflows/test-android-emulator.yml'
  push:
    branches: [ main, 'release/**' ]

concurrency:
  group: android-emulator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-android-emulator:
    name: Android Instrumented Tests (API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: teamorg_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v3

      # Without this the emulator cannot use hardware acceleration and never boots.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create dummy google-services.json
        run: |
          cat > composeApp/google-services.json << 'GSEOF'
          {
            "project_info": { "project_number": "000000000000", "project_id": "dummy-ci", "storage_bucket": "dummy-ci.appspot.com" },
            "client": [{ "client_info": { "mobilesdk_app_id": "1:000000000000:android:0000000000000000", "android_client_info": { "package_name": "ch.teamorg" } }, "oauth_client": [], "api_key": [{ "current_key": "dummy-key-for-ci" }], "services": { "appinvite_service": { "other_platform_oauth_client": [] } } }],
            "configuration_version": "1"
          }
          GSEOF

      - name: Build server
        run: ./gradlew :server:installDist

      # SWISSVOLLEY_SYNC_ENABLED must be false: SwissVolleySyncJob only skips on an
      # explicit false, so the default would poll the real api.volleyball.ch from CI.
      # JWT_SECRET is a disposable CI-only value, well above Security.kt's 32-char floor.
      - name: Start server
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/teamorg_test?user=test&password=test
          JWT_SECRET: ci-instrumented-tests-not-a-real-secret-0123456789
          SWISSVOLLEY_SYNC_ENABLED: 'false'
          STRIPE_SECRET_KEY: sk_test_ci_dummy
        run: |
          server/build/install/server/bin/server > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for server health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/health > /dev/null; then
              echo "server healthy after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "server never became healthy; last 100 log lines:"
          tail -100 server.log
          exit 1

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: ./gradlew :composeApp:connectedDebugAndroidTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: |
            composeApp/build/reports/androidTests/
            server.log
          retention-days: 7

      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" || true
