name: Deploy iOS

permissions:
  contents: read

on:
  push:
    branches:
      - main
    # macOS runners are the most expensive minutes we buy — never spend them on a
    # change that cannot affect the iOS build. Use workflow_dispatch to force one.
    paths:
      - 'composeApp/**'
      - 'shared/**'
      - 'iosApp/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'fastlane/**'
      - 'Gemfile'
      - 'Gemfile.lock'
      - '.xcode-version'
      - '.github/workflows/deploy-ios.yml'
  workflow_dispatch:

# One iOS build per branch; a newer commit supersedes the running one.
concurrency:
  group: deploy-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    name: fastlane ios_check (unsigned simulator build)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.3" # keep in sync with .xcode-version

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true

      - name: Create local.properties
        run: |
          echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" >> local.properties
          echo "onesignal.appId=${{ secrets.ONESIGNAL_APP_ID }}" >> local.properties

      - name: Build
        run: bundle exec fastlane ios_check
